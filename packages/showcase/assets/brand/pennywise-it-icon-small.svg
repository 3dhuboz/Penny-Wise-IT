<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Penny Wise I.T simplified coded jester icon</title>
  <desc id="desc">A simplified professional icon for Penny Wise I.T using a copper penny ring, code bracket eyes, a small red clown nose, and a single smile stroke.</desc>
  <defs>
    <linearGradient id="ring" x1="105" y1="68" x2="402" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0AA55"/>
      <stop offset="0.52" stop-color="#C87632"/>
      <stop offset="1" stop-color="#74301F"/>
    </linearGradient>
    <linearGradient id="face" x1="175" y1="126" x2="337" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4DE"/>
      <stop offset="1" stop-color="#E8D0AA"/>
    </linearGradient>
    <filter id="lift" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111418" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#lift)">
