name = "pennywiseit-dashboard"
main = "src/index.ts"
compatibility_date = "2024-06-01"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Shared with the validator — same composer-db. Dashboard reads sales_sessions
# for auth and apps + validation_runs for the displayed data.
[[d1_databases]]
binding = "DB"
database_name = "composer-db"
database_id = "02e349ac-6932-4d38-a0b1-08f917086124"
