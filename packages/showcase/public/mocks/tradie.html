<!doctype html>
<html><head><meta charset="utf-8"><title>m</title><style>
html,body{margin:0;height:100%;background:#0b0f1a;font-family:system-ui,sans-serif;color:#cbd5e1;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px;height:100%;box-sizing:border-box}
.col{background:#111827;border-radius:6px;border:1px solid #1f2937;padding:7px;display:flex;flex-direction:column;gap:5px}
.h{font-size:8px;letter-spacing:1.5px;font-weight:700;padding:3px 4px;border-radius:3px;text-align:center;color:#0b0f1a}
.col:nth-child(1) .h{background:#fbbf24}
.col:nth-child(2) .h{background:#fb923c}
.col:nth-child(3) .h{background:#f87171}
.c{background:#1e293b;border-radius:4px;padding:6px;font-size:9px;border-left:2px solid #fbbf24;line-height:1.3}
.c b{color:#fbbf24;display:block;font-size:10px;margin-bottom:2px}
.c span{color:#64748b;font-size:8px}
@media (prefers-reduced-motion:no-preference){
.c{animation:flow 12s ease-in-out infinite;position:relative}
.c:nth-child(2){animation-delay:0s}
.c:nth-child(3){animation-delay:3s}
.c:nth-child(4){animation-delay:6s}
.c:nth-child(5){animation-delay:9s}
@keyframes flow{
 0%,8%{transform:translateX(0);opacity:1}
 12%,33%{transform:translateX(calc(100% + 14px));opacity:1}
 37%,58%{transform:translateX(calc(200% + 28px));opacity:1}
 62%,83%{transform:translateX(calc(200% + 28px));opacity:0}
 87%,100%{transform:translateX(0);opacity:1}}
}
</style></head><body>
<div class="app">
<div class="col"><div class="h">QUOTE</div>
<div class="c"><b>Brake service</b><span>Toyota Hilux · Mon</span></div>
<div class="c"><b>RWC inspection</b><span>Mazda 3 · Tue</span></div>
<div class="c"><b>Cooling flush</b><span>Ford Ranger · Wed</span></div>
<div class="c"><b>Timing belt</b><span>VW Golf · Thu</span></div>
<div class="c"><b>Battery + alt</b><span>Holden Cruze · Fri</span></div>
</div>
<div class="col"><div class="h">BOOKED</div></div>
<div class="col"><div class="h">DONE</div></div>
</div>
</body></html>
