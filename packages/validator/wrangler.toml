name = "pennywiseit-validator"
main = "src/index.ts"
compatibility_date = "2024-06-01"

[vars]
ENVIRONMENT = "production"

# The validator's own database — stores app registry and validation results
[[d1_databases]]
binding = "DB"
database_name = "composer-db"
database_id = "02e349ac-6932-4d38-a0b1-08f917086124"

# Cloudflare Workers AI — used for Lead Finder lead generation (free tier)
[ai]
binding = "AI"

# Cron trigger for scheduled health checks
[triggers]
crons = ["0 * * * *"]
