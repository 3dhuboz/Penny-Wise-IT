    <path d="M221 208L185 244L221 280" stroke="#151A21" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M291 208L327 244L291 280" stroke="#151A21" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="273" r="27" fill="#D8292F"/>
    <circle cx="246" cy="263" r="7" fill="#FFB3A0" opacity="0.85"/>
    <path d="M204 322C230 345 282 345 308 322" stroke="#151A21" stroke-width="18" stroke-linecap="round"/>
  </g>
