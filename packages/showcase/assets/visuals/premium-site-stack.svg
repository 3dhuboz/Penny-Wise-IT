    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#27434d" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" rx="64" fill="url(#bg)"/>
