<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Local business proof board</title>
  <desc id="desc">A warm editorial board showing menu, reviews, contact, and workflow cards.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ead7b5"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3f6170"/>
      <stop offset="1" stop-color="#203f49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#071218" flood-opacity=".22"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#e5ad56" opacity=".32"/>
    </pattern>
  </defs>
  <rect width="1200" height="620" rx="54" fill="url(#teal)"/>
  <rect width="1200" height="620" rx="54" fill="url(#dots)"/>
  <g filter="url(#shadow)">
    <rect x="86" y="78" width="318" height="420" rx="28" fill="url(#paper)"/>
    <rect x="126" y="122" width="132" height="26" rx="13" fill="#19343e"/>
    <rect x="126" y="186" width="206" height="34" rx="17" fill="#19343e" opacity=".92"/>
    <rect x="126" y="250" width="238" height="22" rx="11" fill="#315764" opacity=".28"/>
    <rect x="126" y="292" width="196" height="22" rx="11" fill="#315764" opacity=".22"/>
    <rect x="126" y="368" width="112" height="48" rx="24" fill="#e7a246"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="126" width="310" height="356" rx="34" fill="#fffdf8"/>
    <text x="488" y="196" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#19343e">What customers</text>
    <text x="488" y="234" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#19343e">check first</text>
    <line x1="488" y1="276" x2="700" y2="276" stroke="#d3bd93" stroke-width="3"/>
    <text x="488" y="322" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#19343e">Hours</text>
    <text x="488" y="370" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#19343e">Prices or menu</text>
    <text x="488" y="418" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#19343e">Proof and photos</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(3 890 280)">
    <rect x="810" y="84" width="300" height="408" rx="32" fill="#f7ead0"/>
    <rect x="850" y="124" width="150" height="34" rx="17" fill="#d93d37"/>
    <text x="872" y="149" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#fffaf0">NOT JUST FB</text>
    <text x="850" y="224" font-family="Arial, sans-serif" font-weight="900" font-size="46" fill="#11242d">Make the</text>
    <text x="850" y="278" font-family="Arial, sans-serif" font-weight="900" font-size="46" fill="#11242d">next step</text>
    <text x="850" y="332" font-family="Arial, sans-serif" font-weight="900" font-size="46" fill="#11242d">obvious.</text>
    <rect x="850" y="390" width="180" height="48" rx="24" fill="#19343e"/>
  </g>
</svg>
