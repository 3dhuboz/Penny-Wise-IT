<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Premium website and business system preview</title>
  <desc id="desc">Layered website screens, customer proof cards, and business workflow notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9f4e8"/>
      <stop offset=".58" stop-color="#efe3cc"/>
      <stop offset="1" stop-color="#d6c09b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
