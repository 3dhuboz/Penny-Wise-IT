    <path d="M77 72L64 86L77 100" stroke="#151A21" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M103 72L116 86L103 100" stroke="#151A21" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="96" r="10" fill="#D8292F"/>
    <path d="M70 114C80 123 100 123 110 114" stroke="#151A21" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="230" y="133" fill="#151A21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="820">Penny Wise I.T</text>
  <circle cx="884" cy="109" r="8" fill="#D8292F"/>
  <path d="M825 109H876" stroke="#C87632" stroke-width="5" stroke-linecap="round"/>
